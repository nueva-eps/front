<div class="register-container" style="max-width: 500px; margin: 40px auto; padding: 25px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family: Arial, sans-serif;">
  <h2 style="text-align: center; color: #0056b3; margin-bottom: 20px;">Crear Usuario - Nueva EPS</h2>
  
  <!-- Mensajes de Alerta -->
  @if (successMessage) {
    <div style="color: green; background-color: #e6f4ea; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;">
      {{ successMessage }}
    </div>
  }

  @if (errorMessage) {
    <div style="color: red; background-color: #fce8e6; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;">
      {{ errorMessage }}
    </div>
  }

  <!-- Formulario Reactivo -->
  <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Tipo de Documento:</label>
      <select formControlName="idTipoDocumento" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <option [value]="1">Cédula de Ciudadanía (CC)</option>
        <option [value]="2">Tarjeta de Identidad (TI)</option>
        <option [value]="3">Cédula de Extranjería (CE)</option>
        <option [value]="4">Pasaporte (PA)</option>
      </select>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Número de Documento:</label>
      <input type="text" formControlName="numeroDocumento" style="width: 96%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="Ej: 1014987654" />
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <div style="flex: 1;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Primer Nombre:</label>
        <input type="text" formControlName="primerNombre" style="width: 92%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
      </div>
      <div style="flex: 1;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Segundo Nombre:</label>
        <input type="text" formControlName="segundoNombre" style="width: 92%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="(Opcional)" />
      </div>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <div style="flex: 1;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Primer Apellido:</label>
        <input type="text" formControlName="primerApellido" style="width: 92%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
      </div>
      <div style="flex: 1;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Segundo Apellido:</label>
        <input type="text" formControlName="segundoApellido" style="width: 92%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="(Opcional)" />
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Correo Electrónico:</label>
      <input type="email" formControlName="email" style="width: 96%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="ejemplo@nuevaeps.com.co" />
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Contraseña:</label>
      <input type="password" formControlName="password" style="width: 96%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="Mínimo 6 caracteres" />
    </div>

    <button type="submit" [disabled]="registerForm.invalid" style="width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s;">
      Registrar Usuario
    </button>
  </form>

  <div style="text-align: center; margin-top: 15px;">
    <a href="/login" style="color: #0056b3; text-decoration: none; font-size: 14px;">¿Ya tienes una cuenta? Inicia sesión aquí</a>
  </div>
</div>
